services:
  askcsv:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - MAX_ROWS_TO_LLM=${MAX_ROWS_TO_LLM:-20}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - MAX_SESSION_UPLOAD_MB=${MAX_SESSION_UPLOAD_MB:-200}
      - MAX_SESSION_EXPORT_MB=${MAX_SESSION_EXPORT_MB:-200}
      - MAX_FILES_PER_SESSION=${MAX_FILES_PER_SESSION:-20}
      - MAX_EXPORTS_PER_SESSION=${MAX_EXPORTS_PER_SESSION:-20}
      - SESSION_STORAGE_RETENTION_HOURS=${SESSION_STORAGE_RETENTION_HOURS:-24}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - ALLOW_KEY_OVERRIDE=${ALLOW_KEY_OVERRIDE:-true}
    volumes:
      - ./data:/app/data
